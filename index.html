<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skate Arcade v0.1</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #a9c4d8;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      #hint {
        position: fixed;
        left: 12px;
        bottom: 10px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-size: 13px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">↑ remar · ↓ frear (+ ←/→ powerslide) · ← → virar/girar · segure e solte Espaço = ollie (Q nollie) · A/D/S/W ao soltar = flips · no ar J/L = grab · no chão S/W = manual · R reset</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
